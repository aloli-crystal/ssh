name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install
      - name: Format check
        run: crystal tool format --check src/ spec/
      - name: Lint (ameba)
        run: bin/ameba
      - name: Specs
        run: crystal spec
